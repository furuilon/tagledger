[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "tagledger"
description = "Read-only Git tag drift audits from explicit, reviewable baselines"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hidden Gems contributors" }]
dependencies = []
dynamic = ["version"]
keywords = ["dependency security", "Git tags", "software supply chain", "version control"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
tagledger = "tagledger.cli:main"

[tool.setuptools.dynamic]
version = { attr = "tagledger.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
