[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "tagledger"
version = "0.1.0"
description = "Read-only Git tag drift audits from explicit, reviewable baselines"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hidden Gems contributors" }]
dependencies = []

[project.scripts]
tagledger = "tagledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
